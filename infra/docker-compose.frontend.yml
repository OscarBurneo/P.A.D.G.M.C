# Equipo frontend. No levanta la API: API_UPSTREAM y API_PROXY_TARGET
# apuntan al equipo backend. Cambiar la IP no reconstruye la imagen.
# Perfiles nginx y vite: un `up` sin perfil no arranca ninguno, para no
# publicar 8080 y 5173 a la vez por descuido.
# host.docker.internal existe en Docker Desktop y, con extra_hosts, también
# en Docker Engine de Linux.

name: padgmc-frontend

services:
  frontend:
    profiles: ["nginx"]
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://api:8000}
    ports:
      - "8080:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend-dev:
    profiles: ["vite"]
    image: node:22-alpine
    init: true
    working_dir: /app
    command:
      - sh
      - -c
      - |
        node -e "const fs=require('fs'); fs.writeFileSync('/tmp/entrada.sh', fs.readFileSync('/entrada/frontend-dev-entrada.sh','utf8').replace(/\r/g,''))" && exec sh /tmp/entrada.sh
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://host.docker.internal:8000}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
      CHOKIDAR_INTERVAL: ${CHOKIDAR_INTERVAL:-300}
      HMR_HOST: ${HMR_HOST:-}
      HMR_CLIENT_PORT: ${HMR_CLIENT_PORT:-5173}
      HMR_PROTOCOL: ${HMR_PROTOCOL:-ws}
      DEV_ALLOWED_HOSTS: ${DEV_ALLOWED_HOSTS:-true}
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
      - ./frontend-dev-entrada.sh:/entrada/frontend-dev-entrada.sh:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  frontend_node_modules:
